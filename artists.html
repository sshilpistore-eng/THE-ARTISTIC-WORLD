<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Artists — The Artist World</title>
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="siteHeader"></header>

<section class="hero" style="padding-bottom:20px;">
  <div class="wrap hero-inner reveal">
    <h1>Meet the artists.</h1>
    <p>Click a card to open a full profile — biography, movement and major work.</p>
  </div>
  <div class="wrap" style="margin-top:20px;">
    <button class="btn brown" id="randomArtistBtn">🎲 Discover a Random Artist</button>
  </div>
</section>

<section>
  <div class="wrap">
    <div class="grid-4 reveal" id="artistGrid"></div>
  </div>
</section>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <button class="modal-close" id="modalClose">✕</button>
    <div id="modalContent"></div>
  </div>
</div>

<footer id="siteFooter"></footer>
<script src="js/app.js"></script>
<script>
renderHeader('artists.html'); renderFooter(); initReveal();
const grid = document.getElementById('artistGrid');
function openModal(a){
  document.getElementById('modalContent').innerHTML = `
    <div class="portrait" style="height:160px;"></div>
    <h2>${a.name}</h2>
    <p class="era" style="color:var(--muted);font-size:.85rem;">${a.era} · ${a.country}</p>
    <span class="tag">${a.movement}</span>
    <p>${a.bio}</p>
    <p><strong>Major work:</strong> ${a.work}</p>`;
  document.getElementById('modalBg').classList.add('open');
}
document.getElementById('modalClose').addEventListener('click', ()=>document.getElementById('modalBg').classList.remove('open'));
document.getElementById('modalBg').addEventListener('click', (e)=>{ if(e.target.id==='modalBg') e.currentTarget.classList.remove('open'); });

SEED_ARTISTS.forEach(a=>{
  const c = document.createElement('div');
  c.className = 'card';
  c.style.cursor = 'pointer';
  c.innerHTML = `<div class="portrait"></div><span class="tag">${a.movement}</span><h3>${a.name}</h3><p>${a.era}</p><a class="link">View Profile →</a>`;
  c.addEventListener('click', ()=>openModal(a));
  grid.appendChild(c);
});

document.getElementById('randomArtistBtn').addEventListener('click', ()=>{
  openModal(SEED_ARTISTS[Math.floor(Math.random()*SEED_ARTISTS.length)]);
});
</script>
</body>
</html>
